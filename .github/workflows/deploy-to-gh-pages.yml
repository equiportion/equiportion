name: Deploy to GitHub Pages

on:
  workflow_call:

env:
  NODE_VERSION: 20

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build production
        run: pnpm run build

      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
        with:
          repository: <TARGET_REPO_OWNER>/<TARGET_REPO_NAME>
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: gh-pages-repo

      - name: Backup protected files
        run: |
          mkdir -p backup
          if [ -d "gh-pages-repo/.well-known" ]; then
            cp -r gh-pages-repo/.well-known backup/
          fi
          if [ -f "gh-pages-repo/assetlinks.json" ]; then
            cp gh-pages-repo/assetlinks.json backup/
          fi

      - name: Clear old files (except protected ones)
        run: |
          cd gh-pages-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.well-known' ! -name 'assetlinks.json' -exec rm -rf {} +

      - name: Copy new build
        run: cp -r dist/* gh-pages-repo/

      - name: Restore protected files
        run: |
          if [ -d "backup/.well-known" ]; then
            cp -r backup/.well-known gh-pages-repo/
          fi
          if [ -f "backup/assetlinks.json" ]; then
            cp backup/assetlinks.json gh-pages-repo/
          fi

      - name: Commit and push changes
        run: |
          cd gh-pages-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Deploy: ${{ github.sha }}"
          git push
