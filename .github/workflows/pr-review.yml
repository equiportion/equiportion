name: CI/CD Pipeline on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: 20

jobs:
  install-npm-dependencies:
    name: Install npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

  build-review:
    name: Build (Review)
    runs-on: ubuntu-latest
    needs: install-npm-dependencies
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Patch Vite base path
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          REF_SLUG="pr-$PR_NUMBER"
          echo "REF_SLUG=$REF_SLUG" >> "$GITHUB_ENV"
          sed -i "s#base: '/'#base: '/$REF_SLUG/'#g" vite.config.ts

      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-review
          path: dist/

  test:
    needs: build-review
    uses: ./.github/workflows/test-stage.yml
    with:
      node-version: '20'
